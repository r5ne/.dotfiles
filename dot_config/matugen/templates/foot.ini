[colors-dark]
# Cursor Colors (Format: <text-color> <cursor-color>)
# text color - {{colors.on_surface_variant.default.hex}}
# cursor color - {{colors.on_surface.default.hex}}
cursor={{colors.on_surface_variant.default.hex_stripped}} {{colors.on_surface.default.hex_stripped}}

# Base UI Colors
# {{colors.on_surface.default.hex}}
foreground={{colors.on_surface.default.hex_stripped}}
# {{colors.surface.default.hex}}
background={{colors.surface.default.hex_stripped}}
# {{colors.on_secondary.default.hex}}
selection-foreground={{colors.on_secondary.default.hex_stripped}}
# {{colors.secondary_fixed_dim.default.hex}}
selection-background={{colors.secondary_fixed_dim.default.hex_stripped}}
# {{colors.primary.default.hex}}
urls={{colors.primary.default.hex_stripped}}

# 16-Color terminal palette
# black - {{ colors.surface.default.hex }}
regular0={{ colors.surface.default.hex_stripped }}
# red - {{ colors.error.default.hex }}
regular1={{ colors.error.default.hex_stripped }}
# green - {{ colors.tertiary.default.hex }}
regular2={{ colors.tertiary.default.hex_stripped }}
# yellow - {{ colors.secondary.default.hex }}
regular3={{ colors.secondary.default.hex_stripped }}
# blue - {{ colors.primary.default.hex }}
regular4={{ colors.primary.default.hex_stripped }}
# magenta - {{ colors.tertiary_fixed_dim.default.hex }}
regular5={{ colors.tertiary_fixed_dim.default.hex_stripped }}
# cyan - {{ colors.secondary_fixed_dim.default.hex }}
regular6={{ colors.secondary_fixed_dim.default.hex_stripped }}
# white - {{ colors.on_surface.default.hex }}
regular7={{ colors.on_surface.default.hex_stripped }}

# black - {{ colors.surface_variant.default.hex }}
bright0={{ colors.surface_variant.default.hex_stripped }}
# red - {{ colors.error_container.default.hex }}
bright1={{ colors.error_container.default.hex_stripped }}
# green - {{ colors.tertiary_container.default.hex }}
bright2={{ colors.tertiary_container.default.hex_stripped }}
# yellow - {{ colors.secondary_container.default.hex }}
bright3={{ colors.secondary_container.default.hex_stripped }}
# blue - {{ colors.primary_container.default.hex }}
bright4={{ colors.primary_container.default.hex_stripped }}
# magenta - {{ colors.on_secondary_fixed_variant.default.hex }}
bright5={{ colors.on_secondary_fixed_variant.default.hex_stripped }}
# cyan - {{ colors.on_tertiary_fixed_variant.default.hex }}
bright6={{ colors.on_tertiary_fixed_variant.default.hex_stripped }}
# white - {{ colors.on_surface_variant.default.hex }}
bright7={{ colors.on_surface_variant.default.hex_stripped }}
