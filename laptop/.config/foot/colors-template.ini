[colors-dark]
# transparent blurred background
alpha=0.85
blur=yes

# Cursor Colors (Format: <text-color> <cursor-color>)
# text color - #c5c6d0
# cursor color - #e3e2e9
cursor=c5c6d0 e3e2e9

# Base UI Colors
# #e3e2e9
foreground=e3e2e9
# #121318
background=121318
# #2a3042
selection-foreground=2a3042
# #c1c6dd
selection-background=c1c6dd
# #b3c5ff
urls=b3c5ff

# 16-Color terminal palette
# black - #121318
regular0=121318
# red - #ffb4ab
regular1=ffb4ab
# green - #e1bbdc
regular2=e1bbdc
# yellow - #c1c6dd
regular3=c1c6dd
# blue - #b3c5ff
regular4=b3c5ff
# magenta - #e1bbdc
regular5=e1bbdc
# cyan - #c1c6dd
regular6=c1c6dd
# white - #e3e2e9
regular7=e3e2e9

# black - #45464f
bright0=45464f
# red - #93000a
bright1=93000a
# green - #5a3d58
bright2=5a3d58
# yellow - #414659
bright3=414659
# blue - #314578
bright4=314578
# magenta - #414659
bright5=414659
# cyan - #5a3d58
bright6=5a3d58
# white - #e3e2e9
bright7=e3e2e9
